services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: react-project-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-51330}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      # Required — no default secret (see audit V-04). Set in .env.docker.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENABLE_FILE_WORKSPACE: ${ENABLE_FILE_WORKSPACE:-0}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-600000}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-7}
      REGISTER_MAX_ATTEMPTS: ${REGISTER_MAX_ATTEMPTS:-5}
      DB_PATH: /app/data/gym.db
      WORKSPACE_FILES_ROOT: /app/workspace-files
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_OCR_MODEL: ${OLLAMA_OCR_MODEL:-glm-ocr}
    volumes:
      - app_data:/app/data
      - ./workspace-files:/app/workspace-files
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
    name: react-project-app-data
